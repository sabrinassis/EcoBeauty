<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoiar | EcoBeauty</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container nav-container">
            <div class="logo">EcoBeauty 🌸</div>
            <nav aria-label="Navegação Principal">
                <ul class="nav-links">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="quem-somos.html">Quem Somos</a></li>
                    <li><a href="coletas.html">Coletas</a></li>
                    <li><a href="apoiar.html" aria-current="page">Apoiar</a></li>
                </ul>
            </nav>
            <div class="accessibility-controls">
                <button onclick="toggleFontSize()">A+</button>
                <button onclick="toggleDarkMode()">Contraste</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="form-container">
            <h1 style="text-align: center; margin-bottom: 8px;">Colabore com a Rede</h1>
            <p style="text-align: center; margin-bottom: 32px; color: var(--text-color);">Cadastre seu perfil ou anuncie seus frascos acumulados.</p>

            <form action="#" method="POST" id="apoioForm">
                <div class="form-group">
                    <label for="nome">Nome / Instituição</label>
                    <input type="text" id="nome" required placeholder="Digite seu nome">
                </div>
                <div class="form-group">
                    <label for="email">E-mail ou WhatsApp para contato</label>
                    <input type="email" id="email" required placeholder="exemplo@email.com">
                </div>
                <div class="form-group">
                    <label for="perfil">Você se identifica como:</label>
                    <select id="perfil" required>
                        <option value="consumidor">Consumidor Consciente</option>
                        <option value="catador">Catador Autônomo</option>
                        <option value="cooperativa">Cooperativa de Reciclagem</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="habilidades">Quais materiais você tem para descarte (ou coleta)?</label>
                    <textarea id="habilidades" rows="4" placeholder="Ex: Vidros de sérum âmbar, bisnagas de protetor..."></textarea>
                </div>
                <div style="display: flex; gap: 16px; margin-top: 32px;">
                    <button type="submit" class="btn" style="flex: 2;">Concluir Cadastro</button>
                    <button type="button" class="btn btn-secondary" style="flex: 1;">Salvar</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="container"><p>&copy; 2026 EcoBeauty. Skincare consciente e inclusão socioambiental.</p></div>
    </footer>

    <script>
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        function toggleFontSize() { document.documentElement.classList.toggle('font-large'); }
        
        document.querySelector('.btn-secondary').addEventListener('click', function() {
            const btn = this; btn.innerText = "Salvo!"; btn.style.backgroundColor = "#d1fae5";
            setTimeout(() => { btn.innerText = "Salvar"; btn.style.backgroundColor = ""; }, 2000);
        });
    </script>
</body>
</html>
